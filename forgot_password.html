<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Montage Auto Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { dark: '#111111', light: '#FAFAFA' }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabaseClient.js"></script>
</head>
<body class="bg-light text-dark font-sans antialiased flex items-center justify-center min-h-screen selection:bg-dark selection:text-light py-10">

    <div class="bg-white p-8 w-full max-w-sm rounded-[2rem] shadow-2xl border border-neutral-100 relative mx-4">
        <!-- Logo/Brand Icon representation -->
        <div class="flex justify-center mb-6">
            <a href="index.html" class="flex flex-col items-center">
                <span class="text-xs font-black uppercase tracking-[0.25em] text-neutral-800">Montage</span>
                <span class="text-[8px] font-bold uppercase tracking-[0.4em] text-neutral-400 mt-1">Auto Studio</span>
            </a>
        </div>

        <div class="text-center mb-6">
            <h3 class="text-lg font-bold uppercase tracking-tight font-black">Reset Password</h3>
            <p class="text-xs text-neutral-400 font-normal mt-1.5 leading-relaxed" id="formSubtitle">Enter your registered email address to receive a 6-digit verification code.</p>
        </div>

        <!-- Step 1: Email Form -->
        <div id="emailSection" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-neutral-400 mb-2">Email Address</label>
                <div class="relative w-full">
                    <input type="email" id="resetEmail" placeholder="e.g. client@domain.com" required class="w-full bg-neutral-50 border border-neutral-200 p-3.5 rounded-full text-xs font-semibold focus:outline-none focus:border-dark px-5">
                </div>
            </div>

            <button type="button" id="sendOtpBtn" onclick="handleSendOtp()" class="w-full bg-dark text-light text-xs font-bold tracking-widest uppercase py-3.5 rounded-full border border-dark hover:bg-neutral-800 shadow-sm transition-all flex items-center justify-center">
                <span>Send Code</span>
            </button>
        </div>

        <!-- Step 2: OTP Verification Section -->
        <div id="otpSection" class="hidden space-y-4 mt-4 pt-4 border-t border-neutral-100">
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-neutral-400">6-Digit Verification Code</label>
                    <button type="button" id="resendOtpBtn" onclick="handleResendOtp()" disabled class="text-[10px] font-bold uppercase tracking-wider text-neutral-400 hover:text-dark disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                        Resend OTP
                    </button>
                </div>
                <div class="relative w-full">
                    <input type="text" id="otpCode" placeholder="Enter 6-digit code" maxlength="6" class="w-full bg-neutral-50 border border-neutral-200 p-3.5 rounded-full text-xs font-semibold focus:outline-none focus:border-dark px-5 text-center tracking-widest">
                </div>
            </div>

            <button type="button" id="verifyOtpBtn" onclick="handleVerifyOtp()" class="w-full bg-emerald-600 text-white text-xs font-bold tracking-widest uppercase py-3.5 rounded-full hover:bg-emerald-700 shadow-sm transition-all flex items-center justify-center">
                <span>Verify Code</span>
            </button>
        </div>

        <!-- Step 3: New Password Section -->
        <div id="passwordSection" class="hidden space-y-4 mt-4 pt-4 border-t border-neutral-100">
            <div class="relative w-full">
                <label class="block text-[10px] font-bold uppercase tracking-wider text-neutral-400 mb-2">New Password</label>
                <input type="password" id="newPassword" placeholder="Minimum 8 chars (A-z, 0-9, !@#)" required class="w-full bg-neutral-50 border border-neutral-200 p-3.5 rounded-full text-xs font-semibold focus:outline-none focus:border-dark px-5 pr-12" oninput="checkPasswordStrength(this.value)">
                <button type="button" class="absolute right-4 top-[38px] text-neutral-400 hover:text-dark focus:outline-none" onclick="togglePasswordVisibility('newPassword', this)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </button>
            </div>

            <!-- Password Strength indicator -->
            <div class="px-2">
                <div class="h-1 w-full bg-neutral-100 rounded-full overflow-hidden mb-1.5">
                    <div id="strengthBar" class="h-full bg-red-500 transition-all duration-300 w-0"></div>
                </div>
                <span id="strengthText" class="text-[9px] font-bold uppercase tracking-wider text-neutral-400">Weak</span>
            </div>

            <div class="relative w-full">
                <label class="block text-[10px] font-bold uppercase tracking-wider text-neutral-400 mb-2">Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat new password" required class="w-full bg-neutral-50 border border-neutral-200 p-3.5 rounded-full text-xs font-semibold focus:outline-none focus:border-dark px-5">
            </div>

            <button type="button" id="submitPasswordBtn" onclick="handleResetPassword()" class="w-full bg-dark text-light text-xs font-bold tracking-widest uppercase py-3.5 rounded-full border border-dark hover:bg-neutral-800 shadow-sm transition-all flex items-center justify-center">
                <span>Update Password</span>
            </button>
        </div>

        <div id="statusMessage" class="hidden mt-6 p-4 rounded-2xl text-xs font-semibold text-center"></div>

        <div class="mt-6 pt-4 border-t border-neutral-100 text-center">
            <a href="index.html" class="text-xs font-bold tracking-wider uppercase text-neutral-800 hover:text-black underline underline-offset-4 transition-colors">Back to Home</a>
        </div>
    </div>

    <script>
        let cooldownTimer = null;
        let cooldownSeconds = 0;

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            if (!el) return;
            if (type === 'hide' || !message) {
                el.className = "hidden";
                el.innerText = "";
                return;
            }

            if (type === 'success') {
                el.className = "mt-6 p-4 rounded-2xl text-xs font-semibold text-center bg-green-50 text-green-700 border border-green-100 block transition-all";
            } else {
                el.className = "mt-6 p-4 rounded-2xl text-xs font-semibold text-center bg-red-50 text-red-700 border border-red-100 block transition-all";
            }
            el.innerText = message;
        }

        function startCooldown(seconds = 60) {
            cooldownSeconds = seconds;
            const resendBtn = document.getElementById('resendOtpBtn');
            if (!resendBtn) return;

            resendBtn.disabled = true;
            
            if (cooldownTimer) clearInterval(cooldownTimer);
            
            resendBtn.innerText = `Resend OTP (${cooldownSeconds}s)`;

            cooldownTimer = setInterval(() => {
                cooldownSeconds--;
                if (cooldownSeconds <= 0) {
                    clearInterval(cooldownTimer);
                    cooldownTimer = null;
                    resendBtn.innerText = "Resend OTP";
                    resendBtn.disabled = false;
                } else {
                    resendBtn.innerText = `Resend OTP (${cooldownSeconds}s)`;
                }
            }, 1000);
        }

        async function handleSendOtp() {
            const emailInput = document.getElementById('resetEmail');
            const email = emailInput ? emailInput.value.trim() : '';
            const sendBtn = document.getElementById('sendOtpBtn');

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                showStatus("Please enter a valid email address.", "error");
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Sending Code...</span>
            `;

            showStatus("", "hide");

            try {
                const formData = new FormData();
                formData.append('email', email);
                formData.append('type', 'reset');

                const response = await fetch('api/auth/send_otp.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showStatus(result.message || "Verification code sent to your email.", "success");
                    document.getElementById('otpSection').classList.remove('hidden');
                    emailInput.readOnly = true;
                    sendBtn.innerHTML = "<span>Code Sent ✔</span>";
                    sendBtn.className = "w-full bg-emerald-600 text-white text-xs font-bold tracking-widest uppercase py-3.5 rounded-full shadow-sm transition-all flex items-center justify-center cursor-default";
                    startCooldown(60);
                } else {
                    showStatus(result.message || "Failed to send verification code. Please check your email.", "error");
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = "<span>Send Code</span>";
                }
            } catch (err) {
                console.error("Send OTP failed:", err);
                showStatus("Network error. Please verify your connection and try again.", "error");
                sendBtn.disabled = false;
                sendBtn.innerHTML = "<span>Send Code</span>";
            }
        }

        async function handleResendOtp() {
            if (cooldownSeconds > 0) return;
            const email = document.getElementById('resetEmail').value.trim();
            const resendBtn = document.getElementById('resendOtpBtn');

            resendBtn.disabled = true;
            resendBtn.innerText = "Resending...";

            try {
                const formData = new FormData();
                formData.append('email', email);
                formData.append('type', 'reset');

                const response = await fetch('api/auth/send_otp.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showStatus("A new verification code has been dispatched to your email.", "success");
                    startCooldown(60);
                } else {
                    showStatus(result.message || "Failed to resend verification code.", "error");
                    resendBtn.disabled = false;
                    resendBtn.innerText = "Resend OTP";
                }
            } catch (err) {
                console.error("Resend OTP failed:", err);
                showStatus("Network error. Please try again.", "error");
                resendBtn.disabled = false;
                resendBtn.innerText = "Resend OTP";
            }
        }

        async function handleVerifyOtp() {
            const email = document.getElementById('resetEmail').value.trim();
            const code = document.getElementById('otpCode').value.trim();
            const verifyBtn = document.getElementById('verifyOtpBtn');

            if (!code || code.length !== 6 || !/^\d+$/.test(code)) {
                showStatus("Please enter a valid 6-digit numeric verification code.", "error");
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Verifying...</span>
            `;

            try {
                const formData = new FormData();
                formData.append('email', email);
                formData.append('code', code);
                formData.append('type', 'reset');

                const response = await fetch('api/auth/verify_otp.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showStatus("Email verified! Please choose your new password below.", "success");
                    document.getElementById('otpSection').classList.add('hidden');
                    document.getElementById('passwordSection').classList.remove('hidden');
                    document.getElementById('formSubtitle').innerText = "Create a strong new password for your account.";
                } else {
                    showStatus(result.message || "Invalid verification code. Please try again.", "error");
                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = "<span>Verify Code</span>";
                }
            } catch (err) {
                console.error("Verify OTP failed:", err);
                showStatus("Network error during verification. Please try again.", "error");
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = "<span>Verify Code</span>";
            }
        }

        function togglePasswordVisibility(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-dark">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.815 7.815 3 3m-3-3-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                `;
            } else {
                input.type = 'password';
                btn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                `;
            }
        }

        function checkPasswordStrength(password) {
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            if (!password || password.length < 8) {
                bar.className = "h-full bg-red-500 transition-all duration-300 w-1/4";
                text.innerText = "Too Short (Min 8)";
                text.className = "text-[9px] font-bold uppercase tracking-wider text-red-500";
                return;
            }

            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            if (score <= 2) {
                bar.className = "h-full bg-orange-500 transition-all duration-300 w-2/4";
                text.innerText = "Medium";
                text.className = "text-[9px] font-bold uppercase tracking-wider text-orange-500";
            } else if (score === 3) {
                bar.className = "h-full bg-blue-500 transition-all duration-300 w-3/4";
                text.innerText = "Strong";
                text.className = "text-[9px] font-bold uppercase tracking-wider text-blue-500";
            } else {
                bar.className = "h-full bg-green-500 transition-all duration-300 w-full";
                text.innerText = "Very Secure";
                text.className = "text-[9px] font-bold uppercase tracking-wider text-green-500";
            }
        }

        async function handleResetPassword() {
            const email = document.getElementById('resetEmail').value.trim();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitPasswordBtn');

            if (password.length < 8) {
                showStatus("Password must be at least 8 characters long.", "error");
                return;
            }

            if (!/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password) || !/[^a-zA-Z0-9]/.test(password)) {
                showStatus("Password must contain uppercase, lowercase, numbers, and special characters.", "error");
                return;
            }

            if (password !== confirmPassword) {
                showStatus("Passwords do not match.", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Updating...</span>
            `;

            try {
                const response = await fetch('api/auth/reset_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, new_password: password })
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showStatus(result.message || "Your password has been successfully updated. Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2500);
                } else {
                    showStatus(result.message || "Failed to update password. Please try again.", "error");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "<span>Update Password</span>";
                }
            } catch (err) {
                console.error("Password update failed:", err);
                showStatus("Network error. Please try again.", "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = "<span>Update Password</span>";
            }
        }
    </script>
</body>
</html>
